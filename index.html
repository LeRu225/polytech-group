      "name":"Chrys Ivan AKPOVI",
      "role":"Elève ingénieur à l'ESCAE-INPHB\n",
      "photo":"images/collaborateur-1.jpg",
      "affiche":"images/parcours-collaborateur-1.jpg",
      "bio":"\u003cspan style=\"font-weight: bold\">Le travail, la persévérance et la grâce divine font toujours la différence.\u003c/span>\n\nDepuis le Lycée Classique, où j'ai eu la grâce d'être major de classe, je nourrissais un seul objectif : devenir financier. Mais avec le temps, j'ai compris que Dieu nous conduit parfois selon son plan à lui.\nAprès le baccalauréat, j'ai intégré l'INP-HB, où j'ai obtenu un diplôme de Technicien Supérieur en Gestion-Commerce. Ce parcours m'a permis d'acquérir mes premières expériences en tant qu'analyste crédit, community manager et aujourd'hui apporteur d'affaires.\n\nEn parallèle, j'ai choisi de contribuer à des projets porteurs de sens, notamment à travers POLYTECH GROUP pour former des jeunes compétents pour réussir aux concours.\n\nAprès plusieurs années de constance, de résilience et de travail, j'ai obtenu la passerelle qui me permet aujourd'hui d'intégrer le cycle ingénieur de l'INPHB à l'ESAD, où je poursuis actuellement ma formation.\nJe n'ai peut-être pas suivi le chemin imaginé mais Dieu guide tout."
    },
    {
      "name":"Aquilas KONAN",
      "role":"Elève ingénieur à l'ESCPE-INPHB",
      "photo":"images/collaborateur-2.jpg",
      "affiche":"images/parcours-collaborateur-2.jpg",
      "bio":"\u003cspan style=\"font-weight: bold\">Rien ne se construit sans effort, et rien de durable ne se fait sans patience.\u003c/span>\n\nTout commence au Lycée Classique d’Abidjan, l’un des établissements les plus exigeants de Côte d’Ivoire. C’est là que, grâce aux devanciers, je fais la connaissance de l’INP-HB.\n\nAprès le baccalauréat, dont je sors major de classe, j’intègre ainsi l’INP-HB par les classes préparatoires BCPST.\n\nSuite à deux années de dur labeur, j’intègre le cycle ingénieur de l’ESCPE (École Supérieure de Chimie, du Pétrole et de l’Énergie), où je poursuis aujourd’hui mon parcours en tant qu’élève-ingénieur en fin de cycle.\n\nPar ailleurs ,Animé par une volonté de transmettre, je me suis impliqué dans des projets à valeur ajoutée comme POLYTECH GROUP, dont la mission est d’accompagner les jeunes vers la réussite aux concours."
    },
    {
      "name":"Denis Secredou BRIO",
      "role":"Elève ingénieur à l'ESTP-INPHB",
      "photo":"images/collaborateur-3.jpg",
      "affiche":"images/parcours-collaborateur-3.jpg",
      "bio":"\u003cspan style=\"font-weight: bold\">Du rêve de servir au bâtisseur de demain.\u003c/span>\n\nDurant mon enfance, je souhaitais devenir prêtre ou médecin afin de servir ma communauté. Avec le temps, j’ai compris que l’un des principaux défis de ma région était le manque d’infrastructures routières, ce qui m’a orienté vers le génie civil.\nAprès avoir découvert l’INP-HB lors d’une journée carrière au lycée de Bondoukou, j’ai intégré la filière MPSI de l’INP-HB, étant le seul bachelier de mon lycée à le faire cette année-là, avec un baccalauréat C mention Bien. Après deux années de classes préparatoires, j’ai réussi le concours d’entrée à l’ESTP.\n\nAujourd’hui en troisième année du cycle ingénieur en Travaux Publics, option Infrastructures et Transport, je participe également à l’accompagnement de futurs candidats aux concours de l’INP-HB et de l’ESATIC au sein de Polytech Group.  Je souhaite dans le futur créer un cadre idéal où Dieu et la jeunesse coexistent, car si il y a une chose que je retiens c'est que : Sans Dieu, nous ne sommes rien."
    },
    {
      "name":"Yoshua TANOH",
      "role":"Elève ingénieur à l'ESA-INPHB",
      "photo":"images/collaborateur-4.jpg",
      "bio":"\u003cspan style=\"font-weight: bold\">Depuis mon plus jeune âge, j’ai toujours été animé par la recherche de l’excellence.\u003c/span> \n\nAprès l’obtention de mon baccalauréat série D au Lycée Classique d’Abidjan en 2022, j’ai choisi de poursuivre mes études en Côte d’Ivoire même si l'idée d'aller à l'étranger me traversait énormément l'esprit. \nAdmis à l'INPHB et à L'ESATIC, j'intègre finalement l’INP-HB, l’une des meilleures institutions d’Afrique francophone. À l’issue de deux années de classe préparatoire BCPST, j’ai été admis en cycle ingénieur à l’École Supérieure d’Agronomie (ESA), où je poursuis aujourd’hui une spécialisation en agroalimentaire après l’obtention du diplôme d’Agronome Généraliste.\n\nEn parallèle, je m’investis au sein de Polytech Group pour accompagner les bacheliers dans leur orientation.\nMon ambition est de contribuer au développement industriel ivoirien et de créer une entreprise innovante valorisant les ressources agricoles du pays.\nL’excellence, pour moi, est le fruit du travail, de la vision et de la persévérance.",
