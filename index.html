  "about":{
    "t1":"Polytech Group est un regroupement d’élèves et d’étudiants de l’INPHB, de l’ESATIC et du CME, issus de lycées d’excellence comme le Lycée Classique d’Abidjan et le Lycée Technique d’Abidjan qui ont un amour pour la transmission du savoir.",
    "t2":"Désireux donc d’aider leurs jeunes frères et sœurs à Intégrer les meilleures écoles du pays car se sachant expérimentés, compétents et très rigoureux dans le travail la décision officielle sera prise en Juillet 2024 et Polytech group va accueillir sa première promotion à cette même période. Polytech group ce n'est pas seulement qu'une simple structure, c'est aussi une famille.\n"

  "founders":[
    {
      "name":"Russel YEO",
      "role":"Cofondateur",
      "bio":"Au départ, j'hésitais entre plusieurs métiers : pilote, médecin légiste ou ingénieur généraliste. Les classes préparatoires représentaient donc l'opportunité idéale pour construire progressivement mon projet professionnel.\nJ'ai intégré la première promotion des classes préparatoires PCSI de l'INPHB, en étant l'un, voire le seul, titulaire d'un baccalauréat D avec une mention Assez Bien.\nAprès deux années exigeantes en physique, chimie et mathématiques, j'ai réussi le concours d'entrée à l'École Supérieure des Géomètres et Topographes en France (ESGT), quel gros contraste...\nEn parallèle, à 19 ans, j'ai cofondé Polytech Group en 2024 avec mon ami de longue date. Aujourd'hui, la structure a contribué à l'admission de plus de 80 étudiants à l'INP-HB et de plus de 30 à l'ESATIC et c'est une fierté pour nous.\nJe suis présentement en 3ème année du cycle ingénieur géomètre topographe, je souhaite poursuivre avec un master spécialisé afin de renforcer mon expertise et d'apporter ma pierre au pays.\n",

    {
      "name":"Ange KRA",
      "role":"Cofondateur",
      "bio":"D'Abidjan à Paris, une ambition construite étape par étape.\nDepuis ma Terminale au Lycée Classique d'Abidjan, j'ai toujours eu une vision claire : devenir ingénieur. C'est dans cette optique qu'après mon Baccalauréat Scientifique, j'ai intégré l'École Supérieure des Travaux Publics de l'Institut National Polytechnique Félix Houphouët-Boigny de Yamoussoukro, où j'ai suivi trois années de formation qui m'ont conduit à l'obtention d'un Diplôme Technicien Supérieur Grade Licence en Travaux Publics. En parallèle avec mon ami de longue date, nous avons créé POLYTECH GROUP pour transmettre notre savoir. \nJ'ai décidé de franchir un cap supplémentaire en quittant la Côte d'Ivoire pour intégrer les classes préparatoires intégrées BTP au CESI École d'Ingénieurs à La Rochelle, en France.      Cette étape décisive m'a permis d'accéder à l'École Supérieure d'Ingénieurs des Travaux de la Construction de Paris, où je suis aujourd'hui Élève Ingénieur en Génie Civil.\nQuand la vision est là, chaque étape a un sens !",
